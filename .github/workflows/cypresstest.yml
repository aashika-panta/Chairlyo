name: Cypress Tests

on:
  schedule:
    - cron: "15 10 * * *"

  workflow_dispatch:

  push:
    branches:
      - chairlyo-Aashika

  pull_request:
    branches:
      - chairlyo-Aashika

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Cypress Tests
        run: npx cypress run
        continue-on-error: true
        env:
          CYPRESS_BASE_URL: ${{ secrets.CYPRESS_BASE_URL }}
          CYPRESS_USERNAME: ${{ secrets.CYPRESS_USERNAME }}
          CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}
          BRANCH_ADMIN_EMAIL: ${{ secrets.BRANCH_ADMIN_EMAIL }}
          BRANCH_ADMIN_PASSWORD: ${{ secrets.BRANCH_ADMIN_PASSWORD }}
